<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蛇蛇尋食記</title>
    <style>
        body {
            text-align: center;
            font-family: "Comic Sans MS", cursive, sans-serif;
            background: linear-gradient(to right, #ffdde1, #ee9ca7);
            color: #ff69b4;
        }
        canvas {
            background-color: #fff0f5;
            display: block;
            margin: 20px auto;
            border: 5px solid #ffb6c1;
            border-radius: 15px;
        }
        #score {
            font-size: 22px;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>蛇蛇尋食記</h1>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <p id="score">分數: 0</p>
    
    <audio id="eatSound" src="https://www.myinstants.com/media/sounds/pop.mp3"></audio>
    <audio id="gameOverSound" src="https://www.myinstants.com/media/sounds/vine-boom.mp3"></audio>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const box = 20; // 每格大小
        let score = 0;
        let snake = [{ x: 10 * box, y: 10 * box }];
        let food = {
            x: Math.floor(Math.random() * 20) * box,
            y: Math.floor(Math.random() * 20) * box
        };
        let direction = "RIGHT";

        document.addEventListener("keydown", changeDirection);

        function changeDirection(event) {
            const key = event.keyCode;
            if (key === 37 && direction !== "RIGHT") direction = "LEFT";
            else if (key === 38 && direction !== "DOWN") direction = "UP";
            else if (key === 39 && direction !== "LEFT") direction = "RIGHT";
            else if (key === 40 && direction !== "UP") direction = "DOWN";
        }

        function drawGame() {
            ctx.fillStyle = "#fff0f5";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 畫食物（馬卡龍風格）
            ctx.fillStyle = "#ffb6c1";
            ctx.beginPath();
            ctx.arc(food.x + box / 2, food.y + box / 2, box / 2, 0, Math.PI * 2);
            ctx.fill();

            // 畫蛇（粉粉嫩嫩的風格）
            for (let i = 0; i < snake.length; i++) {
                ctx.fillStyle = i === 0 ? "#ff69b4" : "#ffb6c1";
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
                ctx.strokeStyle = "white";
                ctx.strokeRect(snake[i].x, snake[i].y, box, box);
            }

            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if (direction === "LEFT") snakeX -= box;
            if (direction === "UP") snakeY -= box;
            if (direction === "RIGHT") snakeX += box;
            if (direction === "DOWN") snakeY += box;

            if (snakeX === food.x && snakeY === food.y) {
                score += 10;
                document.getElementById("score").innerText = "分數: " + score;
                document.getElementById("eatSound").play(); // 播放吃到食物音效
                food = {
                    x: Math.floor(Math.random() * 20) * box,
                    y: Math.floor(Math.random() * 20) * box
                };
            } else {
                snake.pop();
            }

            let newHead = { x: snakeX, y: snakeY };

            // 撞牆或撞到自己則遊戲結束
            if (snakeX < 0 || snakeY < 0 || snakeX >= canvas.width || snakeY >= canvas.height || collision(newHead, snake)) {
                clearInterval(game);
                document.getElementById("gameOverSound").play(); // 播放遊戲結束音效
                alert("遊戲結束！你的分數是：" + score);
            }

            snake.unshift(newHead);
        }

        function collision(head, array) {
            for (let i = 0; i < array.length; i++) {
                if (head.x === array[i].x && head.y === array[i].y) {
                    return true;
                }
            }
            return false;
        }

        let game = setInterval(drawGame, 100);
    </script>
</body>
</html>
